name: llm-release-gate
description: Run the target branch's version and this pull request's of a pipeline in gate.yaml, compare them and comment the verdict. On a push or schedule, keep the branch's runs for the requests to come.
inputs:
  pipeline:
    description: The pipeline in gate.yaml to gate; may be left out when gate.yaml has one.
    default: ""
  project-dir:
    description: The project's directory in the repository, with gate.yaml.
    default: "."
  github-token:
    description: Writes the comment (pull-requests write) and reads earlier runs (actions read).
    default: ${{ github.token }}
  cases:
    description: Upload the golden set's text files (cases and text inputs) as a second artifact, for a dashboard to show.
    default: "true"
  cases-retention-days:
    description: Days GitHub keeps that artifact.
    default: "30"
runs:
  using: composite
  steps:
    - name: fork
      id: fork
      shell: bash
      run: |  # on `pull_request` GitHub gives a request from a fork no secrets, so no key for the model
        python3 - >> "$GITHUB_OUTPUT" <<'PY'
        import json, os
        event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
        head = ((event.get("pull_request") or {}).get("head") or {}).get("repo") or {}
        fork = os.environ.get("GITHUB_EVENT_NAME") == "pull_request" and head.get("full_name") != event["repository"]["full_name"]
        print(f"fork={str(fork).lower()}")
        PY
    - name: pipeline
      id: pipeline
      if: steps.fork.outputs.fork != 'true'
      shell: bash
      env:
        PROJECT: ${{ inputs.project-dir }}
        PIPELINE: ${{ inputs.pipeline }}
      run: |
        command -v uv > /dev/null || { echo "::error::run Ilya-Grigoryev/llm-release-gate/setup first"; exit 1; }
        names=$(uv run --project "$PROJECT" llm-release-gate pr --project "$PROJECT" --list) || exit 1
        if [ -z "$PIPELINE" ]; then
          [ "$(printf '%s\n' "$names" | wc -l)" -eq 1 ] || { echo "::error::gate.yaml has several pipelines: name one in \`pipeline\`"; exit 1; }
          PIPELINE=$names
        fi
        echo "name=$PIPELINE" >> "$GITHUB_OUTPUT"
        echo "out=$RUNNER_TEMP/llm-release-gate/$PIPELINE" >> "$GITHUB_OUTPUT"
        echo "cache=$RUNNER_TEMP/llm-release-gate-cache" >> "$GITHUB_OUTPUT"
    - name: can comment
      if: steps.fork.outputs.fork != 'true' && github.base_ref != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROJECT: ${{ inputs.project-dir }}
      run: uv run --project "$PROJECT" llm-release-gate comment --check
    - name: gate
      if: steps.fork.outputs.fork != 'true'
      shell: bash
      env:
        PROJECT: ${{ inputs.project-dir }}
        NAME: ${{ steps.pipeline.outputs.name }}
        CACHE: ${{ steps.pipeline.outputs.cache }}
        GITHUB_TOKEN: ${{ inputs.github-token }}  # reads other jobs' runs; needs actions: read
        # a schedule runs on the default branch
        REFRESH: ${{ (github.event_name == 'schedule' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch)) && 'true' || '' }}
      run: |
        if [ -n "$GITHUB_BASE_REF" ]; then
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          uv run --project "$PROJECT" llm-release-gate pr --base FETCH_HEAD --project "$PROJECT" --pipeline "$NAME" \
            --out "$RUNNER_TEMP/llm-release-gate" --cache "$CACHE"
        elif [ "$REFRESH" = true ]; then  # run the default branch's version unless a job did lately
          uv run --project "$PROJECT" llm-release-gate pr --refresh --project "$PROJECT" --pipeline "$NAME" \
            --out "$RUNNER_TEMP/llm-release-gate" --cache "$CACHE"
        else
          echo "::error::the gate runs on a pull request, or on a push or schedule on the default branch"
          exit 1
        fi
    # each arm this job paid for, named by its version and set, so a later job does not run it again (`shared`);
    # pull_request_target runs the request's code with the target branch's trust, so it shares nothing
    - name: shared runs
      id: shared
      if: ${{ !cancelled() && steps.pipeline.outputs.name != '' && github.event_name != 'pull_request_target' }}
      shell: bash
      env:
        OUT: ${{ steps.pipeline.outputs.out }}
      run: |
        [ ! -f "$OUT/shared.txt" ] || while read -r arm name; do echo "$arm=$name" >> "$GITHUB_OUTPUT"; done < "$OUT/shared.txt"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.shared.outputs.base != '' }}
      with:
        name: ${{ steps.shared.outputs.base }}
        path: |
          ${{ steps.pipeline.outputs.out }}/base.jsonl
          ${{ steps.pipeline.outputs.out }}/base.native.jsonl
        overwrite: true
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.shared.outputs.candidate != '' }}
      with:
        name: ${{ steps.shared.outputs.candidate }}
        path: |
          ${{ steps.pipeline.outputs.out }}/candidate.jsonl
          ${{ steps.pipeline.outputs.out }}/candidate.native.jsonl
        overwrite: true
    - name: comment
      if: ${{ !cancelled() && steps.fork.outputs.fork != 'true' && github.base_ref != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROJECT: ${{ inputs.project-dir }}
        NAME: ${{ steps.pipeline.outputs.name }}
        OUT: ${{ steps.pipeline.outputs.out }}
      run: |  # no comment.md: the job failed before the gate ran, and the request still learns that
        uv run --project "$PROJECT" llm-release-gate comment "$OUT/comment.md" ${NAME:+--name "$NAME"}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.pipeline.outputs.name != '' }}
      with:  # a refresh gives no verdict: a dashboard must not read it as one
        name: ${{ github.base_ref != '' && 'release-gate' || 'llm-release-gate-base' }}-${{ steps.pipeline.outputs.name }}-${{ github.run_attempt }}
        path: |
          ${{ steps.pipeline.outputs.out }}/*.jsonl
          ${{ steps.pipeline.outputs.out }}/*.json
          ${{ steps.pipeline.outputs.out }}/*.md
          ${{ steps.pipeline.outputs.out }}/*.log
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.pipeline.outputs.name != '' && inputs.cases == 'true' && github.base_ref != '' }}
      with:
        name: release-gate-${{ steps.pipeline.outputs.name }}-${{ github.run_attempt }}-cases
        path: ${{ steps.pipeline.outputs.out }}/cases/
        retention-days: ${{ inputs.cases-retention-days }}
        if-no-files-found: ignore
    - name: not checked
      if: steps.fork.outputs.fork == 'true'
      shell: bash
      run: |  # red, never a pass: a required check must not let an unchecked request through
        message="This pull request comes from a fork, and GitHub gives such workflows no secrets, so the gate cannot
        call the model and did not check it. To gate it, a maintainer pushes its branch to this repository and opens the
        request from there."
        printf '### Release gate: not checked\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
        echo "::error title=Release gate: not checked::$(echo $message)"
        exit 1
