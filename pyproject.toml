[project]
name = "llm-release-gate"
version = "0.1.0"
description = "CI release gate for LLM pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ilia Grigorev", email = "a12221388@unet.univie.ac.at" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
llm-release-gate = "llm_release_gate.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # test helpers: replay_pipeline, scripted
