# The same checks as .gitlab-ci.yml, without its secret detection.
name: ci

on:
  push:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet uv==0.11.25
      - run: uv sync --locked
      - name: lint
        run: |
          uv run ruff format --check
          uv run ruff check
      - name: test
        run: uv run pytest
      - name: validate
        run: uv run python -m llm_release_gate.golden validate tests/fixtures/golden
