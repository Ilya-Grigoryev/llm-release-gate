# The same checks as .gitlab-ci.yml, without its secret detection.
name: ci

on:
  push:
  pull_request:  # runs release-gate only

jobs:
  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet uv==0.11.25
      - run: uv sync --locked
      - name: lint
        run: |
          uv run ruff format --check
          uv run ruff check
      - name: test
        run: uv run pytest
      - name: validate
        run: uv run python -m llm_release_gate.golden validate tests/fixtures/golden

  # Each example installs the gate the way another project would.
  example-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [sroie, support-agent, tau2]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet uv==0.11.25
      - run: uv sync --locked
      - if: matrix.example == 'tau2'
        run: sh fetch_data.sh
      - run: uv run pytest

  # Base version (the target branch) against the candidate (this pull request merged into it) on
  # the golden set; one comment with the verdict. Advisory: make it a required check to block merges.
  release-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:  # a new push replaces the run for the old one
      group: release-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      CONFIG: configs/sroie-image.yaml
      GOLDEN_RELEASE: golden-sroie-9436cc87
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet uv==0.11.25
      - name: can comment
        working-directory: examples/sroie
        run: |
          uv sync --locked
          uv run python -m llm_release_gate.comment --check
      - name: golden set
        run: |
          gh release download "$GOLDEN_RELEASE" -p sroie.tar.gz -D /tmp
          mkdir -p data/golden && tar -xzf /tmp/sroie.tar.gz -C data/golden
          cd examples/sroie
          uv run python -m llm_release_gate.golden validate ../../data/golden/sroie --manifest golden/sroie.yaml
      - name: gate
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          ci/gate.sh FETCH_HEAD examples/sroie "$CONFIG" data/golden/sroie out
      - name: comment
        if: success() || failure()
        working-directory: examples/sroie
        run: uv run python -m llm_release_gate.comment ../../out/comment.md
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: release-gate-${{ github.run_attempt }}
          path: |
            out/*.jsonl
            out/*.json
            out/*.md
            out/*.log
