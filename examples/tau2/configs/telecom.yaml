# tau2's own agent on the telecom domain: the version under test. Alone or with the simulated user is the golden set's
# choice (../../data/golden/tau2-telecom-solo or -chat). The policy files come from tau2's data (sh fetch_data.sh).
pipeline: tau2_example.gate_adapter
model: gpt-5.4-mini-2026-03-17
prompt:
  main: ../../../data/tau2-bench/data/tau2/domains/telecom/main_policy.md
  main_solo: ../../../data/tau2-bench/data/tau2/domains/telecom/main_policy_solo.md
  tech_support: ../../../data/tau2-bench/data/tau2/domains/telecom/tech_support_manual.md
input: task
params: {temperature: 0}
max_retries: 3
timeout_s: 600
