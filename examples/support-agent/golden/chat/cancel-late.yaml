id: cancel-late
version: 1
slices:
  category: policy
source: examples/support-agent/cases/cancel-late.yaml
input:
  case: inputs/cancel-late.yaml
  world: inputs/world.yaml
  simulator: inputs/simulator.yaml
expected:
  state_change:
    cancelled:
    - B-202
  actions:
  - tool: cancel_booking
    args:
      booking_id: B-202
scoring:
  method: checks
  aggregate: all
  checks:
  - id: state
    kind: state
    key: state_change
  - id: acted
    kind: active
  - id: verified
    kind: order
    first: find_member
    then:
    - create_booking
    - cancel_booking
    - issue_credit
    - escalate_to_human
  - id: credit-limit
    kind: not_called
    tool: issue_credit
    args:
      amount_eur:
        gt: 30
  - id: steps
    kind: max_steps
    max: 15
