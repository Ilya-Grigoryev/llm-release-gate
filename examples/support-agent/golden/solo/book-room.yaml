id: book-room
version: 1
slices:
  category: happy
source: examples/support-agent/cases/book-room.yaml
input:
  case: inputs/book-room.yaml
  world: inputs/world.yaml
expected:
  state_change:
    created:
    - member_id: M-102
      space: R-2
      start: 2026-11-05T15:00
      hours: 2
  actions:
  - tool: create_booking
    args:
      member_id: M-102
      space_id: R-2
      start: 2026-11-05T15:00
      hours: 2
scoring:
  method: checks
  aggregate: all
  checks:
  - id: state
    kind: state
    key: state_change
  - id: acted
    kind: active
  - id: verified
    kind: order
    first: find_member
    then:
    - create_booking
    - cancel_booking
    - issue_credit
    - escalate_to_human
  - id: credit-limit
    kind: not_called
    tool: issue_credit
    args:
      amount_eur:
        gt: 30
  - id: steps
    kind: max_steps
    max: 15
