id: cancel-big-credit
version: 1
slices:
  category: escalation
source: examples/support-agent/cases/cancel-big-credit.yaml
input:
  case: inputs/cancel-big-credit.yaml
  world: inputs/world.yaml
expected:
  state_change:
    cancelled:
    - B-203
    escalations:
    - M-103
  actions:
  - tool: cancel_booking
    args:
      booking_id: B-203
  - tool: escalate_to_human
    args:
      member_id: M-103
      summary: B-203 cancelled more than 24 hours ahead; credit of 60 EUR needs approval
scoring:
  method: checks
  aggregate: all
  checks:
  - id: state
    kind: state
    key: state_change
  - id: acted
    kind: active
  - id: verified
    kind: order
    first: find_member
    then:
    - create_booking
    - cancel_booking
    - issue_credit
    - escalate_to_human
  - id: credit-limit
    kind: not_called
    tool: issue_credit
    args:
      amount_eur:
        gt: 30
  - id: steps
    kind: max_steps
    max: 15
