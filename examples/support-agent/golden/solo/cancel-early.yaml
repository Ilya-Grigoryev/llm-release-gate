id: cancel-early
version: 1
slices:
  category: policy
source: examples/support-agent/cases/cancel-early.yaml
input:
  case: inputs/cancel-early.yaml
  world: inputs/world.yaml
expected:
  state_change:
    cancelled:
    - B-201
    credits:
    - member_id: M-101
      amount_eur: 15.0
  actions:
  - tool: cancel_booking
    args:
      booking_id: B-201
  - tool: issue_credit
    args:
      member_id: M-101
      amount_eur: 15
      reason: cancelled B-201 more than 24 hours ahead
scoring:
  method: checks
  aggregate: all
  checks:
  - id: state
    kind: state
    key: state_change
  - id: acted
    kind: active
  - id: verified
    kind: order
    first: find_member
    then:
    - create_booking
    - cancel_booking
    - issue_credit
    - escalate_to_human
  - id: credit-limit
    kind: not_called
    tool: issue_credit
    args:
      amount_eur:
        gt: 30
  - id: steps
    kind: max_steps
    max: 15
