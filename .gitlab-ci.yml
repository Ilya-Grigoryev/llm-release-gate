include:
  - template: Security/Secret-Detection.gitlab-ci.yml

.python:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv==0.11.25
    - uv sync --locked

# The SROIE example installs the gate the way another project would.
.example:
  extends: .python
  before_script:
    - pip install --quiet uv==0.11.25
    - cd examples/sroie
    - uv sync --locked

lint:
  extends: .python
  script:
    - uv run ruff format --check
    - uv run ruff check

test:
  extends: .python
  script:
    - uv run pytest

validate:
  extends: .python
  script:
    - uv run python -m llm_release_gate.golden validate tests/fixtures/golden

example-test:
  extends: .example
  script:
    - uv run pytest

# Paid call, so it runs only when started by hand.
model-call:
  extends: .example
  when: manual
  script:
    - uv run python -m llm_release_gate.runner --config configs/sroie-text.yaml --golden ../../tests/fixtures/golden --out model-call.jsonl
  artifacts:
    when: always
    paths:
      - examples/sroie/model-call.jsonl
