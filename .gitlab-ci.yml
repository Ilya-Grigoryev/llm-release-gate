include:
  - template: Security/Secret-Detection.gitlab-ci.yml

.python:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv==0.11.25
    - uv sync --locked

lint:
  extends: .python
  script:
    - uv run ruff format --check
    - uv run ruff check

test:
  extends: .python
  script:
    - uv run pytest

validate:
  extends: .python
  script:
    - uv run python -m llm_release_gate.golden validate tests/fixtures/golden

# Paid call, so it runs only when started by hand.
model-call:
  extends: .python
  when: manual
  script:
    - uv run python -m llm_release_gate.runner --config configs/sroie-text.yaml --golden tests/fixtures/golden --out model-call.jsonl
  artifacts:
    paths:
      - model-call.jsonl
